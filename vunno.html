<!DOCTYPE html>
<html lang="en" dir="ltr">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vunno Editor</title>
    <meta name="description" content="Interactive web code editor supporting HTML, CSS, and JavaScript with live preview and simple validation tests inside the browser." />
    <link rel="shortcut icon" href="Vunno.png" type="image/x-icon" />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  </head>

  <body>

      <style>
          :root
          {
              --bg:#0f1221;
              --body-bg: #0b0f1d;
              --panel:#14182b;
              --muted:#8b93a7;
              --txt:#e9ecf1;
              --brand:#7dd3fc;
              --brand-2:#60a5fa;
              --ok:#22c55e;
              --warn:#eab308;
              --err:#ef4444;
              --radius:18px; 
              --gap:14px;
          }

          *{
              box-sizing:border-box
          }

          html, body{
              height: 100%;
          }

          body{
              font-family: sans-serif; 
              background:linear-gradient(180deg, var(--body-bg), var(--bg) 35%); 
              color: var(--txt);
          }

          .container{
              max-width: 1200px;
              margin-inline: auto;
              padding:14px;
              display: flex;
              align-items: center;
              justify-content:space-between;
          }

          .brand{
              gap: 10px; 
              font-weight: 700;
              padding-top: 5px;
              padding-bottom: 10px;
          }

          .title{
              margin-inline: auto;
              inline-size: 153px;
              block-size: 35px;
              background: url("f1.png")center / cover no-repeat;
          }

          .saveLoad{
              display: flex;
              justify-content: right;
              padding-right: 18px;
              padding-left: 18px;
              gap:10px;
          }

          main{
              max-width: 1516px;
              margin-inline: auto;
              padding: 18px;
              display: grid;
              grid-template-columns: 280px 1fr 360px;
              gap: var(--gap);
          }

          @media (max-width: 1100px){
              main{
                  grid-template-columns: 1fr;
              }
          }

          .card{
          background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03)); 
          border: 1px solid rgba(255,255,255,.1); 
          border-radius:var(--radius); 
          box-shadow: 0 10px 30px rgba(0,0,0,.25)
          }

          .panel{
              padding:16px
          }

          h2, h3{
              margin:0 0 12px
          }

          .muted{
              color:var(--muted);
              font-size:13px
          }

          .stack{
              display:flex;
              flex-direction:column;
              gap: 10px;
          }

          .row{
              display: flex;
              align-items: center;
              gap:10px;
              flex-wrap:wrap;
              justify-content: space-between
          }

          .btn{
          appearance:none; 
          border:none; 
          background:linear-gradient(180deg, var(--brand-2), var(--brand)); 
          color:#08111f; 
          font-weight:700; 
          padding:10px 14px; 
          border-radius:12px; 
          cursor:pointer;
          }

          .btn.secondary{
              background:transparent; 
              border:1px solid rgba(255,255,255,.15); 
              color:var(--txt); 
              box-shadow:none
          }

          .btn.warn{
              background: #00e955;
          }

          .btn.ok{
              background: #00e955;
          }

          .btn.err{
              background:linear-gradient(180deg, #fb7185, #ef4444);
          }

          .select, select, .text{
          background:rgba(255,255,255,.03); 
          border:1px solid rgba(255,255,255,.12); 
          color:var(--txt); 
          padding:10px 12px; 
          border-radius:12px
          }

          textarea.text{
              width:100%;
              min-height:120px;
          }

          .tabs{
              display:flex;
              gap:8px;
              flex-wrap:wrap;
          }

          .tab{
          padding:8px 12px; 
          border-radius:10px; 
          border:1px solid rgba(255,255,255,.14); 
          background:rgba(255,255,255,.03); 
          cursor:pointer; 
          font-weight:700; 
          color:#FFF !important;
          }

          .tab.active{
          background:linear-gradient(180deg, rgba(125,211,252,.18), rgba(96,165,250,.18)); 
          color:#00FF00 !important;
          }

          .editor-wrap{
          position:relative; 
          border:1px solid rgba(255,255,255,.12); 
          border-radius:14px; 
          overflow:hidden; 
          min-height:280px; 
          background:#0b1020
          }

          .editor{
          inline-size:100%; 
          block-size:380px
          }

          iframe.preview{
          inline-size:100%; 
          block-size:380px; 
          border:1px solid rgba(255,255,255,.12); 
          border-radius:14px; 
          background:white
          }

          .out{
          /* font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Cascadia Code", "DejaVu Sans Mono", monospace;  */
          background:#0a0e1a; 
          border:1px solid rgba(255,255,255,.12); 
          border-radius:12px; 
          padding:10px; 
          min-height:160px; 
          overflow:auto; 
          white-space:pre-wrap
          }

          .footer{opacity:.7;
          font-size:12px;
              text-align:center;
              padding:12px
          }

          .badge{
          font-size:12px; 
          padding:4px 8px; 
          border-radius:10px; 
          background:rgba(255,255,255,.08); 
          border:1px solid rgba(255,255,255,.14)
          }

          .kbd{
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Cascadia Code", monospace; 
          background:#0e1324; 
          border:1px solid rgba(255,255,255,.15); 
          border-radius:8px; 
          padding:2px 6px
          }

          label{
              font-size:13px; 
              color:var(--muted);
          }
      </style>

    <header>
      <div class="container_row">
        <div class="brand">
          <div class="logo"></div>
          <div class="title"></div>
        </div>
        <div class="saveLoad">
          <button class="btn secondary" id="saveBtn" title="Save work locally"><span>Save</span></button>
          <button class="btn secondary" id="loadBtn" title="Load work file"><span>Load</span></button>
          <input id="openFile" type="file" accept="application/json" hidden>
        </div>
      </div>
    </header>

    <main>
      <!-- Left: checklist -->
      <aside class="card panel stack">
        <h2>Description</h2>

        <textarea id="assignment" class="text" placeholder="Write the task description here..."></textarea>

        <div class="stack">
          <h2>Validation</h2>
          <label for="testArea">JavaScript only (optional)</label>
          <textarea id="testArea" class="text" placeholder="Write simple tests to append after the student's code to check the solution."></textarea>
        </div>
      </aside>

      <!-- Mid: editor + prview -->
      <section class="stack" id="web-only">
        <div id="webEditors" class="stack card panel">
          <div class="row">
            <h2>HTML / CSS / JS</h2>
            <div class="row">
              <button class="btn ok" id="runWeb">Run</button>
              <button class="btn secondary" id="openPreview">Preview in new window</button>
            </div>
          </div>

          <div class="tabs" id="webTabs" role="tablist" aria-label="Web editors">
            <button class="tab active" role="tab" aria-selected="true" tabindex="0" data-pane="html">HTML</button>
            <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-pane="css">CSS</button>
            <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-pane="js">JavaScript</button>
          </div>

          <!-- html,css,js compilers -->
          <div class="editor-wrap" data-pane="html"><div id="ed_html" class="editor"></div></div>
          <div class="editor-wrap" data-pane="css" hidden><div id="ed_css" class="editor"></div></div>
          <div class="editor-wrap" data-pane="js" hidden><div id="ed_js" class="editor"></div></div>

          <div class="stack">
            <h3>Preview</h3>
            <iframe id="preview" class="preview" sandbox="allow-scripts allow-same-origin allow-modals"></iframe>
          </div>
        </div>
      </section>

      <!-- Right hand display-->
      <aside class="card panel stack">
        <h2>Output</h2>
        <div id="output" class="out" aria-live="polite"></div>
        <div class="row">
          <button class="btn warn" id="runTests">Run with tests</button>
          <button class="btn secondary" id="clearOut">Clear log</button>
        </div>
        <h3>Notes</h3>
        <ul class="muted" style="margin:0 0 8px 0; padding-inline-start:18px">
          <li>Everything runs inside the browser in a sandbox.</li>
          <li>You can save the work as a JSON file and restore it.</li>
          <li>Tip:
              <ul>
                  <li><span class="kbd">Ctrl</span> + <span class="kbd">S</span> to save work locally.</li>
                  <br>
                  <li><span class="kbd">Ctrl</span> + <span class="kbd">O</span> to load work file.</li>
              </ul>
          </li>
        </ul>
      </aside>

    </main>

    <div class="footer">© Juno version 1</div>

    <!-- js1 -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/ace.js"
      integrity="sha512-ZIa+FlPaGDSM+lTl9JaxnQvcfma7ETsOHd9Thbhp5u4RX1uYiDNW7XvUrXv4dJSPetXbiTzWilHEkSg4YpmltQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      onerror="(function(){var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/ace-builds@1.43.2/src-min/ace.js'; document.head.appendChild(s);}())">
    </script>

    <!-- js2 -->
    <script src="vunnojs2.js"></script>
  </body>
</html>
